<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eight Academy | Inscripción Materias Optativas</title>
<style>
  :root{
    --azul: #123c69;
    --azul-claro: #1c5d99;
    --dorado: #e0a832;
    --verde: #2e8b57;
    --rojo: #c0392b;
    --gris: #f4f6f8;
    --borde: #d7dee5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, var(--azul) 0%, var(--azul-claro) 220px, var(--gris) 220px);
    min-height:100vh; color:#1f2937;
  }
  header{
    max-width:760px; margin:0 auto; padding:28px 20px 10px; text-align:center; color:#fff;
  }
  header h1{margin:0; font-size:1.5rem;}
  header p{margin:6px 0 0; opacity:.9; font-size:.9rem;}
  .contenedor{
    max-width:760px; margin:20px auto 60px; padding:0 16px;
  }
  .card{
    background:#fff; border-radius:14px; padding:22px 22px 26px;
    box-shadow:0 10px 25px rgba(18,60,105,.12); margin-bottom:18px;
  }
  .card h2{margin-top:0; font-size:1.1rem; color:var(--azul);}
  label{display:block; font-weight:600; margin:14px 0 6px; font-size:.92rem; color:#374151;}
  input[type=text], select{
    width:100%; padding:11px 12px; border-radius:9px; border:1.5px solid var(--borde);
    font-size:1rem; background:#fbfcfe;
  }
  input[type=text]:focus, select:focus{outline:none; border-color:var(--azul-claro);}
  .autocomplete-wrap{position:relative;}
  .sugerencias{
    position:absolute; z-index:20; background:#fff; border:1.5px solid var(--borde);
    border-top:none; width:100%; max-height:230px; overflow-y:auto; border-radius:0 0 9px 9px;
    box-shadow:0 12px 20px rgba(0,0,0,.08); display:none;
  }
  .sugerencias div{padding:10px 12px; cursor:pointer; font-size:.94rem; border-bottom:1px solid #f0f2f5;}
  .sugerencias div:hover, .sugerencias div.activa{background:var(--gris);}
  .sugerencias .no-match{color:#9aa5b1; font-style:italic; cursor:default;}
  .fila2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .badge{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:.78rem; font-weight:700;
    margin-left:8px; vertical-align:middle;
  }
  .badge.basica{background:#e4f0ff; color:var(--azul-claro);}
  .badge.bachillerato{background:#fdf0dc; color:#a5720c;}
  .solo-lectura{background:#eef1f4; color:#4b5563;}
  .manual-toggle{
    margin-top:10px; font-size:.85rem; color:var(--azul-claro); cursor:pointer; text-decoration:underline;
    display:inline-block;
  }
  .materias{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
  .materia-opcion{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border:1.6px solid var(--borde); border-radius:10px; padding:12px 14px; cursor:pointer;
    transition:.15s;
  }
  .materia-opcion:hover{border-color:var(--azul-claro);}
  .materia-opcion.seleccionada{border-color:var(--azul-claro); background:#f0f7ff;}
  .materia-opcion.llena{opacity:.55; cursor:not-allowed; background:#f7f7f7;}
  .materia-info{display:flex; align-items:center; gap:10px;}
  .materia-info input{width:18px; height:18px;}
  .materia-nombre{font-weight:600; font-size:.96rem;}
  .cupo-tag{font-size:.8rem; font-weight:700; padding:3px 9px; border-radius:20px;}
  .cupo-tag.ok{background:#e6f6ec; color:var(--verde);}
  .cupo-tag.pocos{background:#fff4e0; color:#b8730a;}
  .cupo-tag.lleno{background:#fbe7e5; color:var(--rojo);}
  .btn{
    width:100%; padding:14px; border:none; border-radius:10px; font-size:1rem; font-weight:700;
    background:var(--azul-claro); color:#fff; cursor:pointer; margin-top:20px; transition:.15s;
  }
  .btn:hover{background:var(--azul);}
  .btn:disabled{background:#b7c2cc; cursor:not-allowed;}
  .mensaje{
    margin-top:14px; padding:12px 14px; border-radius:9px; font-size:.92rem; display:none;
  }
  .mensaje.error{background:#fbe7e5; color:var(--rojo); display:block;}
  .mensaje.exito{background:#e6f6ec; color:#1c6b3f; display:block;}
  .mensaje.info{background:#eaf2fb; color:var(--azul-claro); display:block;}
  .oculto{display:none !important;}
  .resumen-final{font-size:.95rem; line-height:1.7;}
  .resumen-final b{color:var(--azul);}
  footer{text-align:center; font-size:.78rem; color:#8b97a3; margin:10px 0 30px;}
  .spinner{
    display:inline-block; width:16px; height:16px; border:2.5px solid #fff;
    border-top-color:transparent; border-radius:50%; animation:girar .7s linear infinite; vertical-align:middle; margin-right:6px;
  }
  @keyframes girar{to{transform:rotate(360deg);}}
  a.admin-link{color:#cfe0f2; font-size:.78rem;}
</style>
</head>

<header>

            <option value="Bachillerato">Bachillerato</option>

        </div>
        <div>
          <label>Nombre completo</label>
          <input type="text" id="nombreManual" placeholder="Nombre completo" disabled>
        </div>
      </div>
      <div class="fila2">
        <div>
          <label>Curso</label>
          <input type="text" id="curso" placeholder="Ej: 8vo, 1ro..." disabled>
        </div>
        <div>
          <label>Paralelo</label>
          <input type="text" id="paralelo" placeholder="Ej: A, B, C..." disabled>
        </div>
      </div>
    </div>
  </div>

  <!-- PASO 2: Selección de materia -->
  <div class="card oculto" id="card-materias">
    <h2>2. Elige tu materia optativa <span id="badgeNivel" class="badge"></span></h2>
    <div id="listaMaterias" class="materias"></div>
    <div id="mensajeForm" class="mensaje"></div>
    <button class="btn" id="btnEnviar" disabled>Confirmar inscripción</button>
  </div>

  <!-- PASO 3: Confirmación -->
  <div class="card oculto" id="card-exito">
    <h2>✅ ¡Inscripción registrada!</h2>
    <div class="resumen-final" id="resumenFinal"></div>
    <button class="btn" onclick="location.reload()">Inscribir a otro estudiante</button>
  </div>

</div>

<footer>
  Eight Academy · Sistema de inscripción de optativas
</footer>

const MATERIAS = {
  Bachillerato: ["Personal Branding", "Video Mapping", "Programación No-Code", "Diseño Gráfico"],
  Basica: ["Multimedia y Creación de Contenido", "Robótica e IA", "Personal Branding", "Producción Musical"]
};
const CUPO_MAX = 25;

let estudianteActual = null; // {nombre, curso, paralelo, nivel, origen}
let materiaSeleccionada = null;
let cuposActuales = null; // { cupoMax, porNivel: { Bachillerato:{disponibles,conteo}, Basica:{...} } }

const $ = (id) => document.getElementById(id);

/* ---------- Autocompletado ---------- */
const inputBuscar = $('buscar');
const cajaSugerencias = $('sugerencias');

inputBuscar.addEventListener('input', () => {
  const q = inputBuscar.value.trim().toUpperCase();
  cajaSugerencias.innerHTML = '';
  estudianteActual = null;
  $('datosEstudiante').classList.add('oculto');
  $('card-materias').classList.add('oculto');

  if (q.length < 2) { cajaSugerencias.style.display = 'none'; return; }

  const coincidencias = ESTUDIANTES.filter(e => e.nombre.toUpperCase().includes(q)).slice(0, 8);

  if (coincidencias.length === 0) {
    cajaSugerencias.innerHTML = '<div class="no-match">No se encontró ese nombre en la lista oficial de estudiantes. Verifica que esté bien escrito. Si el problema persiste, acércate a Secretaría.</div>';
    cajaSugerencias.style.display = 'block';
    return;
  }

  coincidencias.forEach(e => {
    const div = document.createElement('div');
    div.textContent = `${e.nombre} — ${e.curso} "${e.paralelo}" (${e.nivel === 'Bachillerato' ? 'Bachillerato' : 'Básica'})`;
    div.addEventListener('click', () => seleccionarEstudiante(e));
    cajaSugerencias.appendChild(div);
  });
  cajaSugerencias.style.display = 'block';
});

document.addEventListener('click', (ev) => {
  if (!ev.target.closest('.autocomplete-wrap')) cajaSugerencias.style.display = 'none';
});

function seleccionarEstudiante(e){
  estudianteActual = { nombre: e.nombre, curso: e.curso, paralelo: e.paralelo, nivel: e.nivel, origen: 'lista' };
  inputBuscar.value = e.nombre;
  cajaSugerencias.style.display = 'none';

  $('datosEstudiante').classList.remove('oculto');
  $('nivel').value = e.nivel;
  $('nivel').disabled = true;
  $('nombreManual').value = e.nombre;
  $('nombreManual').disabled = true;
  $('curso').value = e.curso;
  $('curso').disabled = true;
  $('paralelo').value = e.paralelo;
  $('paralelo').disabled = true;

  mostrarMaterias(e.nivel);
}

/* ---------- Cupos y materias ---------- */
async function cargarCupos(){
  try {
    const resp = await fetch(API_URL);
    const data = await resp.json();
    if (data.ok) cuposActuales = data.cupos;
  } catch(err){
    console.warn('No se pudieron cargar los cupos en línea todavía.', err);
  }
}

function mostrarMaterias(nivel){
  const badge = $('badgeNivel');
  badge.textContent = nivel === 'Bachillerato' ? 'Bachillerato' : 'Educación Básica';
  badge.className = 'badge ' + (nivel === 'Bachillerato' ? 'bachillerato' : 'basica');

  const lista = $('listaMaterias');
  lista.innerHTML = '';
  materiaSeleccionada = null;
  $('btnEnviar').disabled = true;
  $('mensajeForm').className = 'mensaje';
  $('mensajeForm').textContent = '';

  MATERIAS[nivel].forEach(materia => {
    const disponiblesNivel = (cuposActuales && cuposActuales.porNivel && cuposActuales.porNivel[nivel])
      ? cuposActuales.porNivel[nivel].disponibles : {};
    const disponibles = disponiblesNivel[materia] !== undefined ? disponiblesNivel[materia] : CUPO_MAX;
    const llena = disponibles <= 0;

    const div = document.createElement('div');
    div.className = 'materia-opcion' + (llena ? ' llena' : '');
    div.innerHTML = `
      <div class="materia-info">
        <input type="radio" name="materia" value="${materia}" ${llena ? 'disabled' : ''}>
        <span class="materia-nombre">${materia}</span>
      </div>
      <span class="cupo-tag ${llena ? 'lleno' : (disponibles <= 5 ? 'pocos' : 'ok')}">
        ${llena ? 'CUPOS LLENOS' : disponibles + '/' + CUPO_MAX + ' disponibles'}
      </span>
    `;
    if (!llena){
      div.addEventListener('click', () => {
        document.querySelectorAll('.materia-opcion').forEach(o => o.classList.remove('seleccionada'));
        div.classList.add('seleccionada');
        div.querySelector('input').checked = true;
        materiaSeleccionada = materia;
        $('btnEnviar').disabled = false;
      });
    }
    lista.appendChild(div);
  });

  $('card-materias').classList.remove('oculto');
  $('card-exito').classList.add('oculto');
}

/* ---------- Envío de inscripción ---------- */
$('btnEnviar').addEventListener('click', async () => {
  const msg = $('mensajeForm');
  msg.className = 'mensaje';

  if (!estudianteActual || !estudianteActual.nombre || !estudianteActual.curso || !estudianteActual.paralelo || !estudianteActual.nivel){
    msg.className = 'mensaje error';
    msg.textContent = 'Por favor completa todos tus datos.';
    return;
  }
  if (!materiaSeleccionada){
    msg.className = 'mensaje error';
    msg.textContent = 'Selecciona una materia.';
    return;
  }

  if (API_URL.includes('PEGA_AQUI')){
    msg.className = 'mensaje error';
    msg.textContent = 'Falta configurar la URL del backend (API_URL) en el código.';
    return;
  }

  const btn = $('btnEnviar');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Enviando...';

  try{
    const resp = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        nombre: estudianteActual.nombre,
        curso: estudianteActual.curso,
        paralelo: estudianteActual.paralelo,
        nivel: estudianteActual.nivel,
        materia: materiaSeleccionada,
        origen: estudianteActual.origen
      })
    });
    const data = await resp.json();

    if (!data.ok){
      msg.className = 'mensaje error';
      msg.textContent = data.error || 'Ocurrió un error al registrar la inscripción.';
      btn.disabled = false;
      btn.textContent = 'Confirmar inscripción';
      if (data.cupos) { cuposActuales = data.cupos; mostrarMaterias(estudianteActual.nivel); }
      return;
    }

    cuposActuales = data.cupos;

    $('card-busqueda').classList.add('oculto');
    $('card-materias').classList.add('oculto');
    $('card-exito').classList.remove('oculto');
    $('resumenFinal').innerHTML = `
      <p><b>Nombre:</b> ${estudianteActual.nombre}</p>
      <p><b>Nivel:</b> ${estudianteActual.nivel === 'Bachillerato' ? 'Bachillerato' : 'Educación Básica'}</p>
      <p><b>Curso:</b> ${estudianteActual.curso} "${estudianteActual.paralelo}"</p>
      <p><b>Materia optativa asignada:</b> ${materiaSeleccionada}</p>
    `;
  } catch(err){
    msg.className = 'mensaje error';
    msg.textContent = 'Error de conexión. Verifica tu internet e intenta de nuevo.';
    btn.disabled = false;
    btn.textContent = 'Confirmar inscripción';
  }
});

/* Inicio: cargar cupos en línea al abrir la página */
cargarCupos();
setInterval(cargarCupos, 15000); // refresca cupos cada 15s por si otros estudiantes se inscriben
</script>
</body>
</html>
